name: LMS Platform CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ─── Lint & Type Check ─────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Validate Prisma schema
        working-directory: server
        run: npx prisma validate

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

  # ─── Server Tests ──────────────────────────────
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/lms_test
      JWT_ACCESS_SECRET: test-access-secret-that-is-at-least-32-chars
      JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-32-chars
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Run database migrations
        working-directory: server
        run: npx prisma db push --force-reset

      - name: Run unit tests
        working-directory: server
        run: node tests/unit/auth.test.js

      - name: Run integration tests
        working-directory: server
        run: node tests/integration/api.test.js

  # ─── Security Audit ────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high || true

      - name: Audit client dependencies
        working-directory: client
        run: npm audit --audit-level=high || true

  # ─── Build Docker Images ───────────────────────
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-server, security]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t lms-server:${{ github.sha }} ./server

      - name: Build client image
        run: docker build -t lms-client:${{ github.sha }} ./client

      # In production, push to your container registry:
      # - name: Push to registry
      #   run: |
      #     docker tag lms-server:${{ github.sha }} your-registry/lms-server:latest
      #     docker push your-registry/lms-server:latest
